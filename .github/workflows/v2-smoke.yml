name: v2 smoke suite

on:
  push:
    branches: [master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node >=22.5.0 required (node:sqlite experimental floor).
      # Pinned to 22 to test at the engines minimum; --experimental-sqlite
      # flag is encoded in cli/package.json scripts.test, so npm test carries it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: run smoke suite
        working-directory: cli
        run: npm test

      - name: run watchdog smoke (no network, mock gh via PATH)
        run: sh test/watchdog-smoke.sh
